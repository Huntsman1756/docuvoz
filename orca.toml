# Orca Agent Orchestrator Configuration
#
# Usage:
#   deno task orca              # Interactive mode (orchestrator loop)
#   deno task orca:plan         # Dry-run: shows what would spawn, no agents
#
# OpenCode server required at http://localhost:4096 (default).
# Override with OPENCODE_URL env var.
#
# Ticket CLI (ticket) is required: https://github.com/wedow/ticket/
# Tickets live in .tickets/ directory.

# DocuVoz (auidionan). AGENTS.md is the authoritative behavior spec;
# ticket tags drive the stages below. 
model = "nan/glm5.3-flash"

# NOTE: Stages are evaluated in order; first match wins.
# Specific stages must precede broad ones.
# NO catch-all rule is defined - an untagged open ticket triggers no agent.

# ---------------------------------------------------------------------------
# REVIEW
# Must be evaluated BEFORE PLAN and WORK so completed tickets are reviewed,
# not re-planned or re-executed.
# ---------------------------------------------------------------------------

[[tickets]]
name = "review"
match = { status = "open", tag = "ready-for-review" }
prompt = """You are the project's OpenCode orchestrator.

Review this ticket against its original acceptance criteria.

Do not edit implementation files.

Inspect:

* actual diff;
* actual tests/check output;
* actual repository state.

Never accept the executor's summary as evidence by itself.

If every acceptance criterion is demonstrably satisfied:

* mark the ticket verified/closed according to the available ticket CLI semantics (e.g., `ticket close <id>` or `ticket tag close <id>`).

If anything is incomplete or incorrect:

* return it to ready-for-work (tag: `ready-for-work`);
* record precise deficiencies.

Do not fix implementation yourself.
Do not weaken acceptance criteria.
Do not broaden scope.
"""

# ---------------------------------------------------------------------------
# WORK
# ---------------------------------------------------------------------------

[[tickets]]
name = "work"
match = { status = "open", tag = "ready-for-work" }
prompt = """You are the project's OpenCode orchestrator.

Process this ticket.

You may inspect the repository but you may not edit implementation files.

If implementation is required:

1. convert the ticket into one bounded work contract containing:
   objective
   context
   inputs
   allowed_files
   forbidden_files
   constraints
   tests
   success_criteria
   deliverables

2. delegate that contract ONLY to the OpenCode subagent `executor`.

3. wait for executor completion.

4. inspect the actual resulting diff and test evidence.

5. if plausibly complete, move the ticket to ready-for-review (tag: `ready-for-review`).

6. if blocked by a technical condition, mark blocked (tag: `blocked`) and record the exact blocker.

7. if a new methodological/product/legal/architectural decision is required that has not already been specified, mark needs-human-decision (tag: `needs-human-decision`).

Never edit application code yourself.
Never delegate to any agent except `executor`.
Never change ticket acceptance criteria.
Never change numerical gates.
"""

# ---------------------------------------------------------------------------
# PLAN
# ---------------------------------------------------------------------------

[[tickets]]
name = "plan"
match = { status = "open", tag = "needs-plan" }
prompt = """You are the project's OpenCode orchestrator.

Plan this ticket only.

Do not edit implementation files.

Inspect repository context as needed.

Produce explicit:

* objective;
* inputs/evidence;
* scope;
* non-goals;
* anticipated files/modules;
* acceptance criteria;
* required tests/checks;
* failure behavior.

If the work is objectively specified:

* transition to ready-for-work (tag: `ready-for-work`).

If a required decision is missing:

* transition to needs-human-decision (tag: `needs-human-decision`).

Do not implement.
"""

# ---------------------------------------------------------------------------
# HUMAN DECISION (inactionable)
# ---------------------------------------------------------------------------

[[tickets]]
name = "human-decision"
match = { status = "open", tag = "needs-human-decision" }
inactionable = true

# ---------------------------------------------------------------------------
# BLOCKED (inactionable)
# ---------------------------------------------------------------------------

[[tickets]]
name = "blocked"
match = { status = "open", tag = "blocked" }
inactionable = true

# ---------------------------------------------------------------------------
# VERIFIED (inactionable)
# ---------------------------------------------------------------------------

[[tickets]]
name = "verified"
match = { status = "open", tag = "verified" }
inactionable = true