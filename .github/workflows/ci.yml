name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI always uses the deterministic mock provider: no external service.
      SPEECH_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --engine-strict
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit, golden and integration tests (no network)
        run: npm test
      - name: Evaluation harness (G4a + synthetic smoke + regression metric)
        run: |
          npm run eval:extraction
          npm run eval:spoken
          npm run eval:fidelity
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPEECH_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --engine-strict
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Run e2e tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --engine-strict
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (all dependencies, informational)
        run: npm audit --audit-level=high
