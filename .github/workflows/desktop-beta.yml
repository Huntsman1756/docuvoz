name: desktop-beta

# Intentional beta artifact builds only — never automatic on push.
# Publishing (GitHub Release / beta tag) is a separate, manual step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Setup Rust (host target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: npm ci
        run: npm ci --engine-strict

      - name: Build static desktop frontend
        run: npm run build:desktop

      - name: Build + package sidecar for host target (node24-win-x64)
        run: npm run sidecar:package

      - name: Sidecar packaged smoke (mock, self-contained)
        run: node scripts/smoke-sidecar.mjs src-tauri/binaries/docuvoz-speech-x86_64-pc-windows-msvc.exe

      - name: Build Tauri bundle (NSIS installer)
        run: npx tauri build

      - name: Verify bundled license notices
        run: |
          $hits = Get-ChildItem -Recurse -Include LICENSE,NOTICE.md,THIRD_PARTY_NOTICES.md -Path src-tauri/target/release -ErrorAction SilentlyContinue
          if (-not $hits -or ($hits | Group-Object Name).Count -lt 3) { Write-Error "License notices missing from bundle resources"; exit 1 }
          $hits | ForEach-Object { $_.FullName }

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docuvoz-windows-x64-beta
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Setup Rust (host target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: npm ci
        run: npm ci --engine-strict

      - name: Build static desktop frontend
        run: npm run build:desktop

      - name: Build + package sidecar for host target (node24-macos-arm64)
        run: npm run sidecar:package

      - name: Sidecar packaged smoke (mock, self-contained)
        run: node scripts/smoke-sidecar.mjs src-tauri/binaries/docuvoz-speech-aarch64-apple-darwin

      - name: Build Tauri bundle (app + dmg, ad-hoc signed beta)
        run: npx tauri build

      - name: Show macOS bundles
        run: find src-tauri/target/release/bundle -maxdepth 3 -print

      - name: Verify bundled license notices
        run: |
          base="src-tauri/target/release/bundle/macos"
          for f in LICENSE NOTICE.md THIRD_PARTY_NOTICES.md; do
            hit="$(find "$base" -name "$f" -print -quit)"
            if [ -z "$hit" ]; then echo "License notice missing from .app bundle: $f"; exit 1; fi
            echo "$hit"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docuvoz-macos-arm64-beta
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

# macOS Intel (x86_64-apple-darwin) is intentionally absent: GitHub retired the
# macos-13 Intel runners for open-source, so no reliable Intel runner remains.
# x64 macOS users can run the arm64 build under Rosetta only if the sidecar
# proves compatible — otherwise drop the platform until a runner exists.
